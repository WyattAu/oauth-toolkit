[package]
exclude = ["/target"]
name = "oauth-toolkit"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "Shared OAuth2/OIDC primitives — crypto, PKCE, scopes, CSRF, social login, OIDC, JWKS validation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/oauth-toolkit"
keywords = ["oauth", "oidc", "pkce"]
categories = ["cryptography", "web-programming"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
urlencoding = "2"
shared-state = "0.1.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[[bench]]
name = "oauth_bench"
harness = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
